# =========================================================================
# Dev override — только Postgres локально, api запускается через pnpm dev
# Запуск: docker compose -f docker-compose.dev.yml up -d
# =========================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uletnaya
      POSTGRES_USER: uletnaya
      POSTGRES_PASSWORD: dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uletnaya"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
