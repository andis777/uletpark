name: Debug FTP

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: List FTP directories
        env:
          U: ${{ secrets.WWW_FTP_USER }}
          P: ${{ secrets.WWW_FTP_PASS }}
          H: ${{ secrets.WWW_FTP_HOST }}
        run: |
          set +e
          sudo apt-get install -y -qq lftp
          lftp -e "set ssl:verify-certificate no; set ftp:passive-mode true; pwd; ls -la; cd uletnayaparkovka.ru 2>/dev/null && pwd && ls -la; cd ..; quit" -u "$U,$P" "$H"
          echo "--- second pass ---"
          echo "=== /www/uletnayaparkovka.ru (final) ==="
          lftp -c "set ssl:verify-certificate no; open -u $U,$P $H; cd /www/uletnayaparkovka.ru; ls -la; quit"
          echo "=== content of /www/uletnayaparkovka.ru/.htaccess ==="
          lftp -c "set ssl:verify-certificate no; open -u $U,$P $H; cat /www/uletnayaparkovka.ru/.htaccess; quit"
          echo "=== content of /www/uletnayaparkovka.ru/index.html (first 200 chars) ==="
          lftp -c "set ssl:verify-certificate no; open -u $U,$P $H; cat /www/uletnayaparkovka.ru/index.html | head -c 200; quit"
