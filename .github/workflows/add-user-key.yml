# =========================================================================
# Adds an additional public SSH key to root@server.
# Use when you (or a teammate) need direct SSH access alongside Actions.
# Run: gh workflow run "Add User SSH Key" -R andis777/uletpark -f pubkey="ssh-ed25519 AAAA... comment"
# =========================================================================
name: Add User SSH Key

on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: "Full ssh-ed25519/ssh-rsa public key line"
        required: true
      label:
        description: "Comment / who owns it"
        required: false
        default: "user"

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Append key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            KEY='${{ inputs.pubkey }}'
            LABEL='${{ inputs.label }}'

            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys

            # Не добавляем дубликат
            if grep -qF "$KEY" ~/.ssh/authorized_keys; then
              echo "↺ key already present"
            else
              echo "$KEY" >> ~/.ssh/authorized_keys
              echo "✓ key added (label=$LABEL)"
            fi
            echo "Total authorized keys:"
            wc -l < ~/.ssh/authorized_keys
