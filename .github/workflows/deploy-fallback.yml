# =========================================================================
# Fallback Deploy: используется если self-hosted runner лежит.
# Запускается только вручную (workflow_dispatch).
# Использует ssh-action как раньше — нужны DEPLOY_HOST/USER/PORT/SSH_KEY секреты.
# =========================================================================
name: Deploy API (Fallback via SSH)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for fallback (e.g. self-hosted runner down)"
        required: false
        default: "manual fallback"

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (fallback)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            echo "→ Fallback deploy triggered: ${{ inputs.reason }}"
            if [ -x /usr/local/bin/uletnaya-deploy.sh ]; then
              /usr/local/bin/uletnaya-deploy.sh
            else
              cd /opt/uletnaya
              git fetch --all && git reset --hard origin/main
              docker compose -f docker-compose.fastpanel.yml --env-file .env.production build api
              docker compose -f docker-compose.fastpanel.yml --env-file .env.production up -d api
              docker image prune -f
            fi
            sleep 5
            curl -fsS http://127.0.0.1:7982/api/health
