# =========================================================================
# CI/CD: push в main → SSH в /opt/uletnaya → git pull → docker compose build/up
# Билд идёт прямо на сервере (для слабого VPS экономит диск + нет registry)
# =========================================================================
name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd /opt/uletnaya

            echo "→ Pull from git"
            git fetch --all
            git reset --hard origin/main

            echo "→ Rebuild api image"
            docker compose -f docker-compose.fastpanel.yml --env-file .env.production build api

            echo "→ Restart api"
            docker compose -f docker-compose.fastpanel.yml --env-file .env.production up -d api

            echo "→ Cleanup старых образов"
            docker image prune -f

            echo "→ Healthcheck"
            sleep 8
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:7982/api/health; then
                echo "✓ Healthy on attempt $i"
                exit 0
              fi
              echo "  retry $i..."
              sleep 5
            done
            echo "✗ Healthcheck failed after 5 attempts"
            docker compose -f docker-compose.fastpanel.yml logs api --tail 30
            exit 1

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Telegram notify (optional)
        if: env.TG_TOKEN != ''
        run: |
          STATUS="${{ needs.deploy.result == 'success' && '✅' || '❌' }}"
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=$STATUS Deploy: ${{ github.event.head_commit.message }}"
