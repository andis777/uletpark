# =========================================================================
# CI/CD: push в main → self-hosted runner на 194.87.222.67
#         → запускает /usr/local/bin/uletnaya-deploy.sh
#         → git pull → docker compose build/up → healthcheck
#
# Self-hosted runner ставится скриптом: deploy/scripts/setup-self-hosted-runner.sh
# Билд использует Docker слоистый кэш — в 5× быстрее чем чистый ubuntu-latest.
# =========================================================================
name: Deploy API

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "apps/mobile/**"
      - ".github/workflows/build-mobile*.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, uletnaya]
    timeout-minutes: 15
    steps:
      - name: Where am I
        run: |
          echo "host:    $(hostname)"
          echo "user:    $(whoami)"
          echo "docker:  $(docker --version 2>&1)"
          echo "disk:    $(df -h /opt | tail -1)"

      - name: Run deploy script
        run: sudo /usr/local/bin/uletnaya-deploy.sh

      - name: Smoke test public API
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 http://api.uletnayaparkovka.ru/api/health || echo 000)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 4
          done
          echo "public API health failed"
          exit 1

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Telegram notify (optional)
        if: env.TG_TOKEN != ''
        run: |
          STATUS="${{ needs.deploy.result == 'success' && '✅' || '❌' }}"
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=$STATUS Deploy: ${{ github.event.head_commit.message }}"
