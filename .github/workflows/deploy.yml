# =========================================================================
# CI/CD: push в main → self-hosted runner на 194.87.222.67
#         → запускает /usr/local/bin/uletnaya-deploy.sh
#         → git pull → docker compose build/up → healthcheck
#
# Self-hosted runner ставится скриптом: deploy/scripts/setup-self-hosted-runner.sh
# Билд использует Docker слоистый кэш — в 5× быстрее чем чистый ubuntu-latest.
# =========================================================================
name: Deploy API

# ВНИМАНИЕ: автозапуск по push ОТКЛЮЧЁН 22.07.2026.
# Причина: self-hosted runner (5065331-st93568) собирает и поднимает контейнеры
# У СЕБЯ, а публичный api.uletnayaparkovka.ru обслуживает другой сервер.
# Из-за этого workflow годами показывал ✓, ничего не выкатывая на прод
# (smoke-тест дёргал публичный URL, живой и без деплоя).
# Боевая выкатка теперь: ./deploy/scripts/deploy-to-prod.sh
# Вернуть push-триггер можно, когда деплой начнёт доезжать до прод-сервера.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, uletnaya]
    timeout-minutes: 15
    steps:
      - name: Where am I
        run: |
          echo "host:    $(hostname)"
          echo "user:    $(whoami)"
          echo "docker:  $(docker --version 2>&1)"
          echo "disk:    $(df -h /opt | tail -1)"

      - name: Run deploy script
        run: sudo /usr/local/bin/uletnaya-deploy.sh

      # ВАЖНО: проверяем не «жив ли публичный URL» (он жив и без деплоя — это давало
      # ложно-зелёный CI), а что публичный API реально отдаёт ИМЕННО этот коммит.
      - name: Smoke test public API (verify deployed commit)
        run: |
          URL=https://api.uletnayaparkovka.ru/api/health
          EXPECTED='${{ github.sha }}'
          body=''
          for i in 1 2 3 4 5; do
            body=$(curl -s --max-time 8 "$URL" || echo '')
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "$URL" || echo 000)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 4
          done
          if [ "$code" != "200" ]; then
            echo "::error::Публичный API не отвечает (HTTP $code)"
            exit 1
          fi
          echo "health: $body"
          deployed=$(printf '%s' "$body" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
          if [ -z "$deployed" ] || [ "$deployed" = "unknown" ]; then
            echo "::error::Публичный API не сообщает commit (получено: '${deployed:-нет поля}')."
            echo "::error::Значит на проде образ без APP_COMMIT — выкатка до него не доехала."
            exit 1
          fi
          if [ "$deployed" != "$EXPECTED" ]; then
            echo "::error::Прод отдаёт другой коммит!"
            echo "::error::  ожидали (этот пуш): $EXPECTED"
            echo "::error::  реально на проде:   $deployed"
            echo "::error::Деплой прошёл не на тот хост, что обслуживает api.uletnayaparkovka.ru."
            exit 1
          fi
          echo "✓ Прод действительно обновлён до $deployed"

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Telegram notify (optional)
        if: env.TG_TOKEN != ''
        run: |
          STATUS="${{ needs.deploy.result == 'success' && '✅' || '❌' }}"
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=$STATUS Deploy: ${{ github.event.head_commit.message }}"
