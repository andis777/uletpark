# =========================================================================
# One-shot: собирает образ mailer + запускает контейнер на сервере
# Печатает DNS-записи которые надо добавить (SPF/DKIM/DMARC/PTR)
# Запуск: gh workflow run "Start Mailer" -R andis777/uletpark
# =========================================================================
name: Start Mailer

on:
  workflow_dispatch:

jobs:
  start:
    runs-on: [self-hosted, uletnaya]
    timeout-minutes: 10
    steps:
      - name: Build mailer image
        run: |
          cd /opt/uletnaya
          sudo -n docker compose -f docker-compose.fastpanel.yml --env-file .env.production build mailer

      - name: Start mailer service
        run: |
          cd /opt/uletnaya
          sudo -n docker compose -f docker-compose.fastpanel.yml --env-file .env.production up -d mailer

      - name: Recreate api (чтобы получил DNS для нового mailer)
        run: |
          cd /opt/uletnaya
          sudo -n docker compose -f docker-compose.fastpanel.yml --env-file .env.production up -d --force-recreate api
          sleep 6

      - name: Wait + print DNS records from logs
        run: |
          sleep 5
          echo ""
          echo "============================================================"
          echo "  ЛОГ MAILER КОНТЕЙНЕРА (внутри — DNS записи для копирования)"
          echo "============================================================"
          sudo -n docker logs uletnaya-mailer 2>&1 | head -80
          echo ""
          echo "============================================================"
          echo "  СТАТУС КОНТЕЙНЕРОВ:"
          echo "============================================================"
          sudo -n docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep uletnaya

      - name: Smoke test SMTP from api container
        run: |
          # Подключаемся к mailer:25 через node net (внутри api контейнера)
          sudo -n docker exec uletnaya-api node -e "
            const net = require('net');
            const sock = net.createConnection({host:'mailer',port:25,timeout:5000});
            sock.on('connect', () => { console.log('✓ TCP connect to mailer:25 OK'); });
            sock.on('data', d => { console.log('← ' + d.toString().trim()); sock.write('QUIT\r\n'); });
            sock.on('error', e => { console.log('✗ ' + e.message); process.exit(1); });
            sock.on('end', () => { console.log('✓ SMTP greeting received, mailer is alive'); process.exit(0); });
            setTimeout(() => { console.log('✗ timeout'); process.exit(1); }, 8000);
          "
