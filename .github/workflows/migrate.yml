# =========================================================================
# DB Migration: drizzle-kit push на сервере через self-hosted runner.
# Запускается ПОСЛЕ успешного Deploy API (когда код уже в /opt/uletnaya),
# или вручную через workflow_dispatch.
# =========================================================================
name: DB Migrate

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy API"]
    types: [completed]
    branches: [main]

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: [self-hosted, uletnaya]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 10
    steps:
      - name: Where am I
        run: |
          echo "host:    $(hostname)"
          echo "docker:  $(docker --version 2>&1)"
          # /opt/uletnaya принадлежит root, через docker bind-mount читается из контейнера
          sudo -n docker run --rm -v /opt/uletnaya/packages/db:/db alpine ls -la /db/schema.ts

      - name: Run drizzle-kit push (idempotent)
        run: |
          # POSTGRES_PASSWORD читаем внутри контейнера через --env-file
          # (sudo не разрешён для grep, поэтому делегируем чтение docker'у)
          sudo -n docker run --rm \
            --network uletnaya_uletnaya \
            -v /opt/uletnaya:/app -w /app \
            --env-file /opt/uletnaya/.env.production \
            node:22-alpine sh -c '
              set -e
              export DATABASE_URL="postgres://uletnaya:${POSTGRES_PASSWORD}@postgres:5432/uletnaya"
              corepack enable
              corepack prepare pnpm@9.12.0 --activate
              # Workspace-aware install с фильтром на пакет db
              pnpm install --no-frozen-lockfile --filter @uletnaya/db... --silent
              # Используем pnpm с filter из корня — node_modules/.bin виден
              pnpm --filter @uletnaya/db exec drizzle-kit push --force
            '
          echo "✓ Migration done"

      - name: Verify API still healthy
        run: |
          sleep 2
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:7982/api/health || echo 000)
          [ "$code" = "200" ] && echo "✓ API healthy" || (echo "✗ API HTTP $code"; exit 1)
