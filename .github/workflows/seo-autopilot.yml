name: SEO Autopilot — 8 страниц в день

# Запускается:
# - каждый день в 03:00 UTC (06:00 МСК)
# - вручную через workflow_dispatch
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run daily SEO generator
        working-directory: seo-deploy/auto_pipeline
        env:
          FTP_HOST: ${{ secrets.SEO_FTP_HOST }}
          FTP_USER: ${{ secrets.SEO_FTP_USER }}
          FTP_PASS: ${{ secrets.SEO_FTP_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python daily_run.py

      - name: Commit updated queue back to repo
        run: |
          git config user.name "seo-autopilot"
          git config user.email "seo-autopilot@uletnayaparkovka.ru"
          git add seo-deploy/auto_pipeline/topics_queue.json seo-deploy/static-pages/
          git diff --staged --quiet || git commit -m "chore(seo): автопубликация $(date -u +%Y-%m-%d)"
          git push || echo "Nothing to push"
