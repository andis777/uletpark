# =========================================================================
# Production compose ДЛЯ СЕРВЕРА С FASTPANEL
# - НЕТ контейнера nginx (vhost + TLS делает FastPanel)
# - api биндится на 127.0.0.1:3000 — FastPanel-nginx проксирует api.uletnayaparkovka.ru
# - postgres только на 127.0.0.1:5432
#
# Запуск: docker compose -f docker-compose.fastpanel.yml up -d
# =========================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: uletnaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uletnaya}
      POSTGRES_USER: ${POSTGRES_USER:-uletnaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-uletnaya}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - uletnaya

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: uletnaya/api:local
    container_name: uletnaya-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-uletnaya}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-uletnaya}
      NODE_ENV: production
    ports:
      - "127.0.0.1:7982:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M
    labels:
      - autoheal=true          # autoheal перезапустит контейнер при статусе unhealthy
    networks:
      - uletnaya

  cron:
    image: alpine:3.20
    container_name: uletnaya-cron
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env.production
    volumes:
      - ./deploy/scripts/cron-jobs.sh:/cron-jobs.sh:ro
      - ./deploy/scripts/crontab:/etc/crontabs/root:ro
      - ./backups:/backups
    command: >
      sh -c "apk add --no-cache curl bash postgresql-client &&

             crond -f -l 8"
    networks:
      - uletnaya

  # Собственный outbound SMTP (Exim + DKIM) — для отправки писем клиентам
  # и менеджеру. Слушает на 25/tcp внутри docker network, без авторизации.
  # DKIM-ключи генерируются автоматом при первом запуске и сохраняются
  # в volume mailer_dkim. DNS-записи для добавления печатает в stdout.
  mailer:
    build:
      context: ./deploy/mailer
    image: uletnaya/mailer:local
    container_name: uletnaya-mailer
    restart: unless-stopped
    environment:
      MAIL_DOMAIN: uletnayaparkovka.ru
      MAIL_HOSTNAME: mail.uletnayaparkovka.ru
    volumes:
      - mailer_dkim:/etc/exim/dkim
      - mailer_spool:/var/spool/exim
    # Наружу не публикуем — общается только с api через docker network
    networks:
      - uletnaya

  # Автолечение: перезапускает контейнеры с меткой autoheal=true при статусе unhealthy
  # (restart:unless-stopped реагирует только на падение процесса, не на «завис, но жив»).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: uletnaya-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal   # следить за контейнерами с меткой autoheal=true
      AUTOHEAL_INTERVAL: 10                 # проверка каждые 10 сек
      AUTOHEAL_START_PERIOD: 30             # грейс-период перед началом мониторинга
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  mailer_dkim:
  mailer_spool:

networks:
  uletnaya:
    driver: bridge
