# =========================================================================
# Production docker-compose
# Запуск: docker compose up -d
# Логи:   docker compose logs -f api
# =========================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: uletnaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uletnaya}
      POSTGRES_USER: ${POSTGRES_USER:-uletnaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"     # доступ только с localhost — наружу не торчит
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-uletnaya}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uletnaya

  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-uletnaya/api}:${IMAGE_TAG:-latest}
    container_name: uletnaya-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-uletnaya}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-uletnaya}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"     # nginx прокинет наружу
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - autoheal=true          # autoheal перезапустит контейнер при статусе unhealthy
    networks:
      - uletnaya

  nginx:
    image: nginx:alpine
    container_name: uletnaya-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/letsencrypt-www:/var/www/certbot:ro
    networks:
      - uletnaya

  # Cron-runner: дёргает cron-эндпоинты по расписанию (заменяет Vercel Cron)
  cron:
    image: alpine:3.20
    container_name: uletnaya-cron
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env.production
    volumes:
      - ./deploy/scripts/cron-jobs.sh:/cron-jobs.sh:ro
      - ./deploy/scripts/crontab:/etc/crontabs/root:ro
    command: >
      sh -c "apk add --no-cache curl bash &&
             chmod +x /cron-jobs.sh &&
             crond -f -l 8"
    networks:
      - uletnaya

  # Автолечение: перезапускает контейнеры с меткой autoheal=true при статусе unhealthy
  # (restart:unless-stopped реагирует только на падение процесса, не на «завис, но жив»).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: uletnaya-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal   # следить за контейнерами с меткой autoheal=true
      AUTOHEAL_INTERVAL: 10                 # проверка каждые 10 сек
      AUTOHEAL_START_PERIOD: 30             # грейс-период перед началом мониторинга
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:

networks:
  uletnaya:
    driver: bridge
