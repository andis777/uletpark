# =========================================================================
# Nginx: TLS termination + proxy на api контейнер
# Домены: api.uletnayaparkovka.ru — основной API + admin
#         (опционально admin.uletnayaparkovka.ru — отдельный CNAME)
# =========================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.uletnayaparkovka.ru;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.uletnayaparkovka.ru;

    # SSL (заменить путями после certbot)
    ssl_certificate     /etc/letsencrypt/live/api.uletnayaparkovka.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.uletnayaparkovka.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css text/xml application/xml;
    gzip_min_length 1024;

    # Body size
    client_max_body_size 10M;

    # Логи
    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log;

    # Базовый rate-limit на /api/auth (защита от брутфорса OTP)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # tracker.js — длинный кэш для browser
    location = /tracker.js {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Всё остальное → Next.js
    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Streaming для App Router
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
